<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murogi Trading Pro</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#151515;padding:25px;border-radius:15px;max-width:600px;margin:20px auto;border:1px solid #00ff8844}
button{background:#00ff88;color:#000;padding:15px 25px;border:0;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;width:100%}
#dashboard{display:none}
.stat{display:inline-block;background:#222;padding:15px;margin:10px;border-radius:10px;min-width:120px}
</style>
</head>
<body>
<div id="loginPage" class="card">
<h1>🔥 MUROGI TRADING PRO</h1>
<p>App ID: 34CrnMUw4Rz4TEQX4JVjN ✅<br>Affiliate: KA5MGSJVX3X7 ✅</p>
<button onclick="login()">LOGIN TO DERIV</button>
</div>

<div id="dashboard" class="card">
<h2>✅ Welcome Trader!</h2>
<p id="tokenDisplay"></p>
<div class="stat"><b>Balance</b><br><span id="bal">Loading...</span></div>
<div class="stat"><b>Account</b><br><span id="acc">CR...</span></div>
<button onclick="logout()" style="background:#ff4444;color:#fff;margin-top:20px">LOGOUT</button>
</div>

<script>
const APP_ID = "34CrnMUw4Rz4TEQX4JVjN";
const AFFILIATE_TOKEN = "KA5MGSJVX3X7";
const REDIRECT = "https://murogi-hub.github.io/murogi-trading-pro/";

function login(){
  window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN&brand=deriv&affiliate_token=${AFFILIATE_TOKEN}`;
}
function logout(){
  localStorage.clear();
  window.location.href = REDIRECT;
}

const params = new URLSearchParams(window.location.search);
const token = params.get('token1') || localStorage.getItem('deriv_token');
if(token){
  localStorage.setItem('deriv_token', token);
  document.getElementById('loginPage').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('tokenDisplay').innerText = "Token: " + token.substring(0,25) + "...";
  document.getElementById('acc').innerText = params.get('acct1') || "Connected";
  window.history.replaceState({}, document.title, REDIRECT);
  const ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id='+APP_ID);
  ws.onopen = ()=> ws.send(JSON.stringify({authorize: token}));
  ws.onmessage = (msg)=>{
    const data = JSON.parse(msg.data);
    if(data.authorize){ ws.send(JSON.stringify({balance:1})); }
    if(data.balance){ document.getElementById('bal').innerText = "$" + data.balance.balance; }
  }
}
</script>
</body>
</html>
